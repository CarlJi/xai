name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - "."
          - "spec/openai"
          - "spec/claude"
          - "spec/gemini"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Vet, Build & Test
        working-directory: ${{ matrix.module }}
        run: |
          go vet ./...
          go build ./...
          go test -v -race ./...

  integration-test:
    name: Integration Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'dev'
    strategy:
      fail-fast: false
      matrix:
        module:
          - "spec/openai"
          - "spec/claude"
          - "spec/gemini"
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ] && [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "No API keys configured, skipping integration tests"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        id: check

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-go@v5
        if: steps.check.outputs.skip != 'true'
        with:
          go-version: "1.24"

      - name: Run Integration Tests
        if: steps.check.outputs.skip != 'true'
        working-directory: ${{ matrix.module }}
        run: go test -v -race -tags xaitest ./...
